[package]
name = "neuralnet"
version = "0.1.0"
edition = "2024"

[features]
default = []
gpu = ["dep:cudarc", "dep:shaderc"]

[dependencies]
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
cudarc = { version = "0.17", optional = true, features = ["driver", "nvrtc", "cuda-version-from-build-system", "fallback-latest"] }
flate2 = "1"
rand = "0.9"
rand_distr = "0.5"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shaderc = { version = "0.10", optional = true }
wasmtime = "38"
